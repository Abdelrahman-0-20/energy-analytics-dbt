name: ELT pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly: catches pinned-source and toolchain drift
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit refreshed dashboard CSVs back to the repo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch + load raw layer (pinned, idempotent)
        run: python -m src.pipeline

      - name: Loader tests
        run: python -m pytest -q

      - name: dbt deps
        run: dbt deps --project-dir dbt --profiles-dir dbt

      - name: dbt build — models + data tests
        run: dbt build --project-dir dbt --profiles-dir dbt

      - name: Prove idempotency — second build must change nothing
        run: python scripts/prove_idempotency.py

      - name: Source freshness
        run: dbt source freshness --project-dir dbt --profiles-dir dbt

      # Streamlit Cloud has no warehouse (gitignored build artifact) — publish
      # the gold marts as CSVs so the deployed dashboard has data.
      - name: Export dashboard data
        run: python -m src.export_marts

      - name: Commit refreshed dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data
          if git diff --cached --quiet; then
            echo "dashboard data already fresh"
          else
            git commit -m "chore: refresh dashboard data [skip ci]"
            git push
          fi

      - name: dbt docs
        run: dbt docs generate --project-dir dbt --profiles-dir dbt

      - name: Upload docs site for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dbt/target

  deploy-docs:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
